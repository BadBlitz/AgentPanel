version: 2
updates:
  # Keep the SHA-pinned GitHub Actions in our workflows current. Dependabot
  # opens a PR (updating both the SHA and the trailing version comment) when a
  # newer release of a pinned action is available.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend dependencies (npm) and the Tauri backend (Cargo).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
